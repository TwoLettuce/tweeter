AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM config for Tweeter server

#
# Global Lambda function properties. These apply to every Lambda function.
#
Globals:
  Function:
    Runtime: nodejs20.x
    CodeUri: ./dist/
    Layers:
      - !Ref tweeterLayer
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        USERS_TABLE: !Ref usersTable
        AUTH_TABLE: !Ref authTable
        FOLLOWS_TABLE: !Ref followsTable
        FOLLOW_COUNTS_TABLE: !Ref followCountsTable
        STATUSES_TABLE: !Ref statusesTable
        FEEDS_TABLE: !Ref feedsTable
        BY_FOLLOWEE_INDEX: ByFollowee
        USER_IMAGES_BUCKET: !Ref userImagesBucket
        USER_IMAGE_BASE_URL: !Sub "https://${userImagesDistribution.DomainName}"

#
# Reusable blocks of configuration. These are referenced throughout the template to avoid duplication.
# &identifier is used to define a reusable block, and *identifier is used to reference it.
#
Metadata:
  x-common-policies: &commonPolicies
    - AWSLambdaBasicExecutionRole
    - AmazonSESFullAccess
    - CloudWatchFullAccess
    - AmazonDynamoDBFullAccess
    - AmazonS3FullAccess
    - AmazonSQSFullAccess

  x-common-cors-headers: &commonCorsHeaders
    method.response.header.Access-Control-Allow-Origin: "'*'"

  x-common-swagger-response-headers: &commonSwaggerResponseHeaders
    Access-Control-Allow-Origin:
      type: string

#
# AWS resource definitions
#
Resources:
  #
  # Web API
  #

  tweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: tweeterApi
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      DefinitionBody:
        swagger: "2.0"
        info:
          title: "Tweeter API"
          version: "1.0"
        x-common-consumes: &commonConsumes
          - application/json
        x-common-produces: &commonProduces
          - application/json
        x-common-request-templates: &commonRequestTemplates
          application/json: $input.json('$')
        x-common-amazon-responses: &commonAmazonResponses
          default:
            statusCode: 200
            responseParameters: *commonCorsHeaders
          ".*bad-request.*":
            statusCode: 400
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          ".*unauthorized.*":
            statusCode: 401
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          ".*internal-server-error.*":
            statusCode: 500
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
        x-common-swagger-responses: &commonSwaggerResponses
          "200":
            description: "OK"
            headers: *commonSwaggerResponseHeaders
          "400":
            description: "Bad Request"
            headers: *commonSwaggerResponseHeaders
          "401":
            description: "Unauthorized"
            headers: *commonSwaggerResponseHeaders
          "500":
            description: "Internal Server Error"
            headers: *commonSwaggerResponseHeaders
        paths:
          #
          # Endpoint definitions
          #

          /login:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${login.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /register:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${register.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /logout:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${logout.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /user/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getUser.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /isfollower/{followerAlias}/{followeeAlias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getIsFollower.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /followeecount/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFolloweeCount.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /followercount/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFollowerCount.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /follow:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${follow.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /unfollow:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${unfollow.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /followees/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFollowees.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /followers/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFollowers.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /status:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${postStatus.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /feed/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getFeed.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /story/{alias}:
            post:
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getStory.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses
  #
  # Lambda Layer (reused by all Lambda functions)
  #
  tweeterLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: tweeterLayer
      Description: dependencies layer for Tweeter server
      ContentUri: ./layer/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: DELETE

  #
  # Web API Lambda functions
  #

  login:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: login
      Handler: src/handlers/auth/LoginHandler.loginHandler
      Policies: *commonPolicies
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /login
            Method: POST

  register:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: register
      Handler: src/handlers/auth/RegisterHandler.registerHandler
      Policies: *commonPolicies
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /register
            Method: POST

  logout:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: logout
      Handler: src/handlers/auth/LogoutHandler.logoutHandler
      Policies: *commonPolicies
      Events:
        LogoutApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /logout
            Method: POST

  getUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getUser
      Handler: src/handlers/user/GetUserHandler.getUserHandler
      Policies: *commonPolicies
      Events:
        GetUserApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /user/{alias}
            Method: POST

  getIsFollower:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getIsFollower
      Handler: src/handlers/follow/GetIsFollowerHandler.getIsFollowerHandler
      Policies: *commonPolicies
      Events:
        GetIsFollowerApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /isfollower/{followerAlias}/{followeeAlias}
            Method: POST

  getFolloweeCount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFolloweeCount
      Handler: src/handlers/follow/GetFolloweeCountHandler.getFolloweeCountHandler
      Policies: *commonPolicies
      Events:
        GetFolloweeCountApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /followeecount/{alias}
            Method: POST

  getFollowerCount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFollowerCount
      Handler: src/handlers/follow/GetFollowerCountHandler.getFollowerCountHandler
      Policies: *commonPolicies
      Events:
        GetFollowerCountApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /followercount/{alias}
            Method: POST

  follow:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: follow
      Handler: src/handlers/follow/FollowHandler.followHandler
      Policies: *commonPolicies
      Events:
        FollowApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /follow
            Method: POST

  unfollow:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: unfollow
      Handler: src/handlers/follow/UnfollowHandler.unfollowHandler
      Policies: *commonPolicies
      Events:
        UnfollowApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /unfollow
            Method: POST

  getFollowees:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFollowees
      Handler: src/handlers/followees/GetFolloweesHandler.getFolloweesHandler
      Policies: *commonPolicies
      Events:
        GetFolloweesApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /followees/{alias}
            Method: POST

  getFollowers:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFollowers
      Handler: src/handlers/followers/GetFollowersHandler.getFollowersHandler
      Policies: *commonPolicies
      Events:
        GetFollowersApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /followers/{alias}
            Method: POST

  postStatus:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: postStatus
      Handler: src/handlers/status/PostStatusHandler.postStatusHandler
      Policies: *commonPolicies
      Events:
        PostStatusApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /status
            Method: POST

  getFeed:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFeed
      Handler: src/handlers/status/GetFeedHandler.getFeedHandler
      Policies: *commonPolicies
      Events:
        GetFeedApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /feed/{alias}
            Method: POST

  getStory:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getStory
      Handler: src/handlers/status/GetStoryHandler.getStoryHandler
      Policies: *commonPolicies
      Events:
        GetStoryApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /story/{alias}
            Method: POST

